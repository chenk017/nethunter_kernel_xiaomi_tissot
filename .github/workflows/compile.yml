name: Tissot Kernel Builder NetHunter R8188EUS

on:
  push:
    branches:
      - main
      - master
      - nethunter
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      # ============================================================
      # CHECKOUT SOURCE
      # ============================================================
      - name: Ambil Kode dari Repositori Ini
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES & CROSS COMPILER
      # ============================================================
      - name: Pasang Library, Dependensi, dan Kompiler Lengkap
        run: |
          sudo apt-get update -y

          sudo apt-get install --fix-missing -y \
            bc \
            build-essential \
            libncurses5-dev \
            libssl-dev \
            xz-utils \
            wget \
            curl \
            git \
            cpio \
            lz4 \
            rsync \
            libxml2 \
            flex \
            bison \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi


      # ============================================================
      # OPENSSL / CERTIFICATE FIX
      # ============================================================
      - name: Jinakkan File OpenSSL dan Buat Kunci Tiruan
        run: |
          echo "=== Menjinakkan Berkas extract-cert.c ==="

          echo 'int main(int argc, char **argv) { return 0; }' \
            > scripts/extract-cert.c

          mkdir -p certs

          touch certs/signing_key.x509
          touch certs/x509_certificate_list


      # ============================================================
      # AVTIMER FIX
      # ============================================================
      - name: Fix Avtimer Type Error
        run: |
          echo "=== Menonaktifkan Baris avtimer_fptr Bermasalah ==="

          if [ -f techpack/audio/dsp/avtimer.c ]; then
            sed -i \
              's/msm_isp_set_avtimer_fptr(av_fptr);/\/\/ msm_isp_set_avtimer_fptr(av_fptr);/g' \
              techpack/audio/dsp/avtimer.c
          fi


      # ============================================================
      # NETHUNTER + HID + R8188EUS + NAT CONFIGURATION
      # ============================================================
      - name: Otomatisasi Fitur NetHunter, R8188EUS, dan NAT
        run: |

          CONFIG_FILE="arch/arm64/configs/tissot_defconfig"

          echo "=================================================="
          echo " MENYIAPKAN KONFIGURASI NETHUNTER"
          echo "=================================================="

          # USB / HID
          echo "CONFIG_USB_G_ANDROID=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_F_HID=y" >> "$CONFIG_FILE"
          echo "CONFIG_CONFIGFS_F_HID=y" >> "$CONFIG_FILE"

          # WIRELESS CORE
          echo "CONFIG_WIRELESS=y" >> "$CONFIG_FILE"
          echo "CONFIG_CFG80211=y" >> "$CONFIG_FILE"
          echo "CONFIG_MAC80211=y" >> "$CONFIG_FILE"

          # REALTEK R8188EUS
          echo "CONFIG_WLAN_VENDOR_REALTEK=y" >> "$CONFIG_FILE"
          echo "CONFIG_NEW_REALTEK=y" >> "$CONFIG_FILE"
          echo "CONFIG_RTL8188EU=y" >> "$CONFIG_FILE"

          # USB SUPPORT
          echo "CONFIG_USB=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_USBNET=y" >> "$CONFIG_FILE"

          # KALI NETHUNTER NAT & NETFILTER SUPPORT
          echo "CONFIG_NETFILTER=y" >> "$CONFIG_FILE"
          echo "CONFIG_NETFILTER_ADVANCED=y" >> "$CONFIG_FILE"
          echo "CONFIG_NF_CONNTRACK=y" >> "$CONFIG_FILE"
          echo "CONFIG_NF_CONNTRACK_IPV4=y" >> "$CONFIG_FILE"
          echo "CONFIG_IP_NF_IPTABLES=y" >> "$CONFIG_FILE"
          echo "CONFIG_IP_NF_FILTER=y" >> "$CONFIG_FILE"
          echo "CONFIG_IP_NF_NAT=y" >> "$CONFIG_FILE"
          echo "CONFIG_IP_NF_TARGET_MASQUERADE=y" >> "$CONFIG_FILE"
          echo "CONFIG_IP_NF_TARGET_REDIRECT=y" >> "$CONFIG_FILE"
          echo "CONFIG_NETFILTER_XT_MATCH_STATE=y" >> "$CONFIG_FILE"
          echo "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y" >> "$CONFIG_FILE"

          # MATIKAN BLUETOOTH
          echo "CONFIG_BT=n" >> "$CONFIG_FILE"
          echo "CONFIG_MSM_BT_POWER=n" >> "$CONFIG_FILE"
          echo "CONFIG_BTFM_SLIM=n" >> "$CONFIG_FILE"
          echo "CONFIG_BTFM_SLIM_WCN3990=n" >> "$CONFIG_FILE"

          # MATIKAN MODULE SIGNATURE
          echo "CONFIG_MODULE_SIG=n" >> "$CONFIG_FILE"
          echo "CONFIG_MODULE_SIG_FORCE=n" >> "$CONFIG_FILE"
          echo "CONFIG_SYSTEM_TRUSTED_KEYRING=n" >> "$CONFIG_FILE"
          echo "CONFIG_SYSTEM_REVOCATION_LIST=n" >> "$CONFIG_FILE"

          # CAMERA / AVTIMER
          echo "CONFIG_VIDEO_V4L2_SUBDEV_API=n" >> "$CONFIG_FILE"
          echo "CONFIG_MEDIA_CAMERA_SUPPORT=n" >> "$CONFIG_FILE"
          echo "CONFIG_MSM_CAMERA=n" >> "$CONFIG_FILE"
          echo "CONFIG_MSM_CAMERA_V4L2=n" >> "$CONFIG_FILE"
          echo "CONFIG_MSM_AVTIMER=n" >> "$CONFIG_FILE"

          echo "=================================================="
          echo " KONFIGURASI SELESAI"
          echo "=================================================="


      # ============================================================
      # GENERATE DEFCONFIG
      # ============================================================
      - name: Generate Tissot Defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make tissot_defconfig


      # ============================================================
      # VERIFY FINAL CONFIGURATION
      # ============================================================
      - name: Verifikasi Konfigurasi Final
        run: |
          echo "=================================================="
          echo " HASIL KONFIGURASI FINAL"
          echo "=================================================="

          echo "--- USB / HID ---"
          grep -E 'CONFIG_USB=|CONFIG_USB_USBNET|CONFIG_USB_G_ANDROID|CONFIG_USB_F_HID|CONFIG_CONFIGFS_F_HID' .config || true

          echo "--- WIRELESS CORE ---"
          grep -E 'CONFIG_WLAN=|CONFIG_WIRELESS=|CONFIG_CFG80211=|CONFIG_MAC80211=' .config || true

          echo "--- REALTEK R8188EUS ---"
          grep -E 'CONFIG_WLAN_VENDOR_REALTEK=|CONFIG_NEW_REALTEK=|CONFIG_RTL8188EU=' .config || true

          echo "--- KALI NETHUNTER NAT ---"
          grep -E 'CONFIG_NETFILTER=|CONFIG_IP_NF_NAT=|CONFIG_IP_NF_TARGET_MASQUERADE=' .config || true


      # ============================================================
      # HARD VALIDATION R8188EUS & NAT
      # ============================================================
      - name: Validasi R8188EUS dan NAT
        run: |
          echo "=================================================="
          echo " VALIDASI R8188EUS DAN NAT"
          echo "=================================================="
          
          FAILED=0

          if grep -q '^CONFIG_WLAN_VENDOR_REALTEK=y$' .config; then
            echo "OK: CONFIG_WLAN_VENDOR_REALTEK=y"
          else
            echo "ERROR: CONFIG_WLAN_VENDOR_REALTEK tidak aktif"
            FAILED=1
          fi

          if grep -q '^CONFIG_NEW_REALTEK=y$' .config; then
            echo "OK: CONFIG_NEW_REALTEK=y"
          else
            echo "ERROR: CONFIG_NEW_REALTEK tidak aktif"
            FAILED=1
          fi

          if grep -q '^CONFIG_RTL8188EU=y$' .config; then
            echo "OK: CONFIG_RTL8188EU=y"
          else
            echo "ERROR: CONFIG_RTL8188EU tidak aktif"
            FAILED=1
          fi

          if grep -q '^CONFIG_IP_NF_NAT=y$' .config; then
            echo "OK: CONFIG_IP_NF_NAT=y (Dukungan NAT Aktif)"
          else
            echo "ERROR: CONFIG_IP_NF_NAT tidak aktif!"
            FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            echo "Validasi gagal. Hentikan proses build."
            exit 1
          fi


      # ============================================================
      # COMPILE KERNEL WITH MULTIPLE TRACE PATH FIX
      # ============================================================
      - name: Proses Kompilasi Kernel
        run: |
          echo "=================================================="
          echo " MEMULAI PROSES KOMPILASI KERNEL TISSOT"
          echo "=================================================="
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # KCFLAGS diperluas untuk menyertakan folder KGSL, IPA_V2, dan IPA_CLIENTS
          make -j$(nproc --all) KCFLAGS="-I$(pwd)/drivers/gpu/msm -I$(pwd)/drivers/platform/msm/ipa/ipa_v2 -I$(pwd)/drivers/platform/msm/ipa/ipa_clients"
          
          echo "=================================================="
          echo " KOMPILASI SELESAI"
          echo "=================================================="


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Unggah Hasil Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Tissot
          path: arch/arm64/boot/Image.gz-dtb
