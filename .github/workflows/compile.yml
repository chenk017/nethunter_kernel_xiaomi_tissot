name: Tissot Kernel Builder NetHunter

on:
  push:
    branches:
      - main
      - master
      - nethunter
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================================
      # DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            bc \
            build-essential \
            libncurses5-dev \
            libssl-dev \
            xz-utils \
            wget \
            curl \
            git \
            cpio \
            lz4 \
            rsync \
            libxml2 \
            flex \
            bison \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # =========================================================
      # OPENSSL / CERT FIX
      # =========================================================
      - name: Fix certificate build
        run: |
          cat > scripts/extract-cert.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          touch certs/signing_key.x509
          touch certs/x509_certificate_list

      # =========================================================
      # AVTIMER FIX
      # =========================================================
      - name: Fix avtimer
        run: |
          find drivers -type f -name "*.c" -exec \
            sed -i \
            's/msm_isp_set_avtimer_fptr(av_fptr);/\/\/ msm_isp_set_avtimer_fptr(av_fptr);/g' \
            {} \;

      # =========================================================
      # CONFIG INJECTION
      # =========================================================
      - name: Inject NetHunter / HID / WiFi config
        run: |

          CONFIG_FILE="arch/arm64/configs/tissot_defconfig"

          echo "=================================================="
          echo " INJECT CONFIG"
          echo "=================================================="

          cat >> "$CONFIG_FILE" <<'EOF'

          # =================================================
          # USB HID / GADGET
          # =================================================
          CONFIG_USB=y
          CONFIG_USB_G_ANDROID=y
          CONFIG_USB_F_HID=y
          CONFIG_CONFIGFS_F_HID=y

          # =================================================
          # WIRELESS CORE
          # =================================================
          CONFIG_WIRELESS=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y

          # =================================================
          # USB NETWORK
          # =================================================
          CONFIG_USB_USBNET=y

          # =================================================
          # REALTEK R8188EUS
          # =================================================
          CONFIG_NEW_REALTEK=y
          CONFIG_RTL8188EU=y

          # =================================================
          # DISABLE BLUETOOTH
          # =================================================
          CONFIG_BT=n
          CONFIG_MSM_BT_POWER=n
          CONFIG_BTFM_SLIM=n

          EOF

          echo
          echo "=================================================="
          echo " CONFIG YANG DI-INJECT"
          echo "=================================================="

          grep -nE \
            'CONFIG_USB_G_ANDROID|CONFIG_USB_F_HID|CONFIG_CONFIGFS_F_HID|CONFIG_WIRELESS|CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_USB_USBNET|CONFIG_NEW_REALTEK|CONFIG_RTL8188EU|CONFIG_BT=' \
            "$CONFIG_FILE" || true

      # =========================================================
      # CHECK REALTEK KCONFIG SOURCE
      # =========================================================
      - name: Check Realtek Kconfig source
        run: |

          echo "=================================================="
          echo " REALTEK KCONFIG SOURCE"
          echo "=================================================="

          echo
          echo "--- realtek/Kconfig ---"

          grep -n "newrtl" \
            drivers/net/wireless/realtek/Kconfig \
            || true

          echo
          echo "--- newrtl/Kconfig ---"

          grep -n -A20 -B5 \
            "config NEW_REALTEK" \
            drivers/net/wireless/realtek/newrtl/Kconfig \
            || true

          echo
          echo "--- rtl8188eus/Kconfig ---"

          grep -n -A15 -B5 \
            "config RTL8188EU" \
            drivers/net/wireless/realtek/newrtl/rtl8188eus/Kconfig \
            || true

      # =========================================================
      # CHECK BEFORE DEFCONFIG
      # =========================================================
      - name: Check config before defconfig
        run: |

          CONFIG_FILE="arch/arm64/configs/tissot_defconfig"

          echo "=================================================="
          echo " SEBELUM MAKE TISSOT_DEFCONFIG"
          echo "=================================================="

          grep -nE \
            'CONFIG_NEW_REALTEK|CONFIG_RTL8188EU|CONFIG_USB_F_HID|CONFIG_CONFIGFS_F_HID|CONFIG_WIRELESS|CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_USB=' \
            "$CONFIG_FILE" \
            || true

      # =========================================================
      # DEFCONFIG
      # =========================================================
      - name: Generate kernel config
        run: |

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=================================================="
          echo " MENJALANKAN TISSOT_DEFCONFIG"
          echo "=================================================="

          make tissot_defconfig

      # =========================================================
      # POST DEFCONFIG CHECK
      # =========================================================
      - name: Verify final Kconfig
        run: |

          echo "=================================================="
          echo " HASIL KCONFIG DI .config"
          echo "=================================================="

          echo
          echo "--- USB / HID ---"

          grep -nE \
            'CONFIG_USB_G_ANDROID|CONFIG_USB_F_HID|CONFIG_CONFIGFS_F_HID' \
            .config \
            || true

          echo
          echo "--- WIRELESS CORE ---"

          grep -nE \
            'CONFIG_WIRELESS|CONFIG_CFG80211|CONFIG_MAC80211' \
            .config \
            || true

          echo
          echo "--- REALTEK R8188EUS ---"

          grep -nE \
            'CONFIG_NEW_REALTEK|CONFIG_RTL8188EU' \
            .config \
            || true

          echo
          echo "--- USB ---"

          grep -nE \
            'CONFIG_USB=|CONFIG_USB_USBNET' \
            .config \
            || true

          echo
          echo "--- NEGATIVE CONFIG ---"

          grep -nE \
            '# CONFIG_NEW_REALTEK is not set|# CONFIG_RTL8188EU is not set' \
            .config \
            || true

      # =========================================================
      # VALIDATE R8188EUS
      # =========================================================
      - name: Validate R8188EUS
        run: |

          echo "=================================================="
          echo " VALIDASI R8188EUS"
          echo "=================================================="

          if grep -q '^CONFIG_NEW_REALTEK=y$' .config && \
             grep -q '^CONFIG_RTL8188EU=y$' .config; then

              echo "R8188EUS CONFIG: OK"
              echo "CONFIG_NEW_REALTEK=y"
              echo "CONFIG_RTL8188EU=y"

          else

              echo "ERROR: R8188EUS BELUM AKTIF DI .config"
              echo
              echo "Isi yang ditemukan:"

              grep -nE \
                'NEW_REALTEK|RTL8188EU' \
                .config \
                || true

              exit 1

          fi

      # =========================================================
      # COMPILE
      # =========================================================
      - name: Compile kernel
        run: |

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export LOCALVERSION="-Umbaran_01"
          export KBUILD_BUILD_USER="sukma"
          export KBUILD_BUILD_HOST="UmbaranDev-Cloud"

          export ROOT_DIR="${{ github.workspace }}"

          export INTERNAL_INCLUDES="\
          -I${ROOT_DIR}/include \
          -I${ROOT_DIR}/arch/arm64/include \
          -I${ROOT_DIR}/arch/arm64/include/generated \
          -I${ROOT_DIR}/include/generated"

          echo "=================================================="
          echo " MULAI KOMPILASI KERNEL"
          echo "=================================================="

          make -j$(nproc --all) \
            KCFLAGS="-w -fpermissive ${INTERNAL_INCLUDES}" \
            CFLAGS_MODULE="-w" \
            CONFIG_SYSTEM_TRUSTED_KEYS="" \
            CONFIG_MODULE_SIG=n \
            CONFIG_MSM_AVTIMER=n \
            CONFIG_BT=n

      # =========================================================
      # CHECK OUTPUT
      # =========================================================
      - name: Check kernel output
        run: |

          echo "=================================================="
          echo " HASIL BUILD"
          echo "=================================================="

          find arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( \
              -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "*.dtb" \
            \) \
            -print

      # =========================================================
      # PREPARE ARTIFACT
      # =========================================================
      - name: Prepare artifact
        run: |

          mkdir -p output

          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
              cp arch/arm64/boot/Image.gz-dtb output/
          elif [ -f arch/arm64/boot/Image.gz ]; then
              cp arch/arm64/boot/Image.gz output/
          fi

          find arch/arm64/boot/dts \
            -type f \
            -name "*.dtb" \
            -exec cp {} output/ \; \
            2>/dev/null || true

          echo "=================================================="
          echo " OUTPUT"
          echo "=================================================="

          ls -lh output

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: tissot-kernel-r8188eus
          path: output/
