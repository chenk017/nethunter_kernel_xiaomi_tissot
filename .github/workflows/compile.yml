name: Tissot Kernel - Diagnose R8188EUS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================================
      # DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            bc \
            build-essential \
            libncurses5-dev \
            libssl-dev \
            xz-utils \
            wget \
            curl \
            git \
            cpio \
            lz4 \
            rsync \
            libxml2 \
            flex \
            bison \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # =========================================================
      # OPENSSL / CERT FIX
      # =========================================================
      - name: Fix certificate build
        run: |
          cat > scripts/extract-cert.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          touch certs/signing_key.x509
          touch certs/x509_certificate_list

      # =========================================================
      # AVTIMER FIX
      # =========================================================
      - name: Fix avtimer
        run: |
          find drivers \
            -type f \
            -name "*.c" \
            -exec sed -i \
            's/msm_isp_set_avtimer_fptr(av_fptr);/\/\/ msm_isp_set_avtimer_fptr(av_fptr);/g' \
            {} \;

      # =========================================================
      # SHOW ORIGINAL CONFIG
      # =========================================================
      - name: Inspect original tissot defconfig
        run: |

          CONFIG_FILE="arch/arm64/configs/tissot_defconfig"

          echo "=================================================="
          echo " ORIGINAL TISSOT DEFCONFIG"
          echo "=================================================="

          echo
          echo "--- WLAN / WIRELESS ---"

          grep -nE \
            'CONFIG_WLAN|CONFIG_WIRELESS|CONFIG_CFG80211|CONFIG_MAC80211|WLAN_VENDOR' \
            "$CONFIG_FILE" \
            || true

          echo
          echo "--- REALTEK ---"

          grep -nE \
            'NEW_REALTEK|RTL8188EU|WLAN_VENDOR_REALTEK' \
            "$CONFIG_FILE" \
            || true

      # =========================================================
      # CHECK REALTEK KCONFIG SOURCE
      # =========================================================
      - name: Inspect Realtek Kconfig
        run: |

          echo "=================================================="
          echo " REALTEK KCONFIG SOURCE"
          echo "=================================================="

          echo
          echo "===== drivers/net/wireless/realtek/Kconfig ====="

          sed -n '1,100p' \
            drivers/net/wireless/realtek/Kconfig \
            || true

          echo
          echo "===== drivers/net/wireless/realtek/newrtl/Kconfig ====="

          sed -n '1,150p' \
            drivers/net/wireless/realtek/newrtl/Kconfig \
            || true

          echo
          echo "===== rtl8188eus/Kconfig ====="

          cat \
            drivers/net/wireless/realtek/newrtl/rtl8188eus/Kconfig \
            || true

      # =========================================================
      # CHECK REALTEK MAKEFILE
      # =========================================================
      - name: Inspect Realtek Makefile
        run: |

          echo "=================================================="
          echo " REALTEK MAKEFILE"
          echo "=================================================="

          echo
          echo "===== realtek/Makefile ====="

          cat \
            drivers/net/wireless/realtek/Makefile \
            || true

          echo
          echo "===== newrtl/Makefile ====="

          cat \
            drivers/net/wireless/realtek/newrtl/Makefile \
            || true

          echo
          echo "===== rtl8188eus/Makefile ====="

          cat \
            drivers/net/wireless/realtek/newrtl/rtl8188eus/Makefile \
            || true

      # =========================================================
      # CHECK SYMBOL REFERENCES
      # =========================================================
      - name: Search Realtek symbols
        run: |

          echo "=================================================="
          echo " SYMBOL REFERENCES"
          echo "=================================================="

          echo
          echo "--- NEW_REALTEK ---"

          grep -Rni \
            "NEW_REALTEK" \
            drivers/net/wireless \
            --include='Kconfig*' \
            --include='Makefile*' \
            2>/dev/null \
            | head -100 \
            || true

          echo
          echo "--- RTL8188EU ---"

          grep -Rni \
            "RTL8188EU" \
            drivers/net/wireless \
            --include='Kconfig*' \
            --include='Makefile*' \
            2>/dev/null \
            | head -100 \
            || true

      # =========================================================
      # INJECT CONFIG
      # =========================================================
      - name: Inject diagnostic config
        run: |

          CONFIG_FILE="arch/arm64/configs/tissot_defconfig"

          echo "=================================================="
          echo " INJECT DIAGNOSTIC CONFIG"
          echo "=================================================="

          cat >> "$CONFIG_FILE" <<'EOF'

          # =================================================
          # USB
          # =================================================
          CONFIG_USB=y
          CONFIG_USB_USBNET=y

          # =================================================
          # USB HID
          # =================================================
          CONFIG_USB_G_ANDROID=y
          CONFIG_USB_F_HID=y
          CONFIG_CONFIGFS_F_HID=y

          # =================================================
          # WIRELESS CORE
          # =================================================
          CONFIG_WIRELESS=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y

          # =================================================
          # REALTEK R8188EUS
          # =================================================
          CONFIG_NEW_REALTEK=y
          CONFIG_RTL8188EU=y

          # =================================================
          # BLUETOOTH OFF
          # =================================================
          CONFIG_BT=n
          CONFIG_MSM_BT_POWER=n
          CONFIG_BTFM_SLIM=n

          EOF

          echo
          echo "=================================================="
          echo " CONFIG SEBELUM DEFCONFIG"
          echo "=================================================="

          grep -nE \
            'CONFIG_USB=|CONFIG_USB_USBNET|CONFIG_USB_F_HID|CONFIG_CONFIGFS_F_HID|CONFIG_WIRELESS|CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_NEW_REALTEK|CONFIG_RTL8188EU|CONFIG_BT=' \
            "$CONFIG_FILE" \
            || true

      # =========================================================
      # RUN DEFCONFIG
      # =========================================================
      - name: Run tissot defconfig
        run: |

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=================================================="
          echo " RUN MAKE TISSOT_DEFCONFIG"
          echo "=================================================="

          make tissot_defconfig

      # =========================================================
      # DIAGNOSE FINAL .CONFIG
      # =========================================================
      - name: Diagnose final Kconfig
        run: |

          echo "=================================================="
          echo " DIAGNOSA FINAL KCONFIG"
          echo "=================================================="

          echo
          echo "##################################################"
          echo "# 1. REALTEK SYMBOL"
          echo "##################################################"

          grep -nE \
            'NEW_REALTEK|RTL8188EU' \
            .config \
            || true


          echo
          echo "##################################################"
          echo "# 2. REALTEK VENDOR"
          echo "##################################################"

          grep -nE \
            'WLAN_VENDOR_REALTEK|WLAN_VENDOR_ATH|WLAN_VENDOR_' \
            .config \
            || true


          echo
          echo "##################################################"
          echo "# 3. WLAN / WIRELESS"
          echo "##################################################"

          grep -nE \
            'CONFIG_WLAN=|CONFIG_WIRELESS=|CONFIG_CFG80211=|CONFIG_MAC80211=' \
            .config \
            || true


          echo
          echo "##################################################"
          echo "# 4. USB"
          echo "##################################################"

          grep -nE \
            'CONFIG_USB=|CONFIG_USB_USBNET|CONFIG_USB_F_HID|CONFIG_CONFIGFS_F_HID' \
            .config \
            || true


          echo
          echo "##################################################"
          echo "# 5. NEGATIVE SYMBOL"
          echo "##################################################"

          grep -nE \
            '# CONFIG_NEW_REALTEK is not set|# CONFIG_RTL8188EU is not set|# CONFIG_WLAN_VENDOR_REALTEK is not set|# CONFIG_WLAN is not set' \
            .config \
            || true


          echo
          echo "##################################################"
          echo "# 6. COMPLETE WIRELESS SECTION"
          echo "##################################################"

          sed -n '1080,1180p' \
            .config \
            || true


          echo
          echo "##################################################"
          echo "# 7. WLAN SECTION"
          echo "##################################################"

          sed -n '1600,1680p' \
            .config \
            || true


          echo
          echo "##################################################"
          echo "# 8. FINAL STATUS"
          echo "##################################################"

          if grep -q '^CONFIG_NEW_REALTEK=y$' .config; then
              echo "NEW_REALTEK = YES"
          else
              echo "NEW_REALTEK = NO"
          fi

          if grep -q '^CONFIG_RTL8188EU=y$' .config; then
              echo "RTL8188EU = YES"
          else
              echo "RTL8188EU = NO"
          fi

          if grep -q '^CONFIG_WLAN=y$' .config; then
              echo "WLAN = YES"
          else
              echo "WLAN = NO"
          fi

          if grep -q '^CONFIG_WIRELESS=y$' .config; then
              echo "WIRELESS = YES"
          else
              echo "WIRELESS = NO"
          fi

          if grep -q '^CONFIG_CFG80211=y$' .config; then
              echo "CFG80211 = YES"
          else
              echo "CFG80211 = NO"
          fi

          if grep -q '^CONFIG_MAC80211=y$' .config; then
              echo "MAC80211 = YES"
          else
              echo "MAC80211 = NO"
          fi


          echo
          echo "=================================================="
          echo " DIAGNOSA SELESAI"
          echo "=================================================="

          echo
          echo "CATATAN:"
          echo "Workflow ini sengaja TIDAK melakukan compile."
          echo "Tujuan run ini hanya mencari penyebab"
          echo "CONFIG_RTL8188EU dibuang oleh Kconfig."
