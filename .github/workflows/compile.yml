name: Tissot Kernel Builder NetHunter R8188EUS

on:
  push:
    branches:
      - main
      - master
      - nethunter
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # =========================================================
      # INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            bc \
            build-essential \
            libncurses5-dev \
            libssl-dev \
            xz-utils \
            wget \
            curl \
            git \
            cpio \
            lz4 \
            rsync \
            libxml2 \
            flex \
            bison \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi


      # =========================================================
      # OPENSSL / CERTIFICATE FIX
      # =========================================================
      - name: Fix certificate build
        run: |
          cat > scripts/extract-cert.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          touch certs/signing_key.x509
          touch certs/x509_certificate_list


      # =========================================================
      # AVTIMER FIX
      # =========================================================
      - name: Fix avtimer
        run: |
          find drivers \
            -type f \
            -name "*.c" \
            -exec sed -i \
            's/msm_isp_set_avtimer_fptr(av_fptr);/\/\/ msm_isp_set_avtimer_fptr(av_fptr);/g' \
            {} \;


      # =========================================================
      # CONFIG INJECTION
      # =========================================================
      - name: Configure NetHunter HID and R8188EUS
        run: |

          CONFIG_FILE="arch/arm64/configs/tissot_defconfig"

          echo "=================================================="
          echo " INJECT KERNEL CONFIG"
          echo "=================================================="

          cat >> "$CONFIG_FILE" <<'EOF'

          # =================================================
          # USB
          # =================================================
          CONFIG_USB=y
          CONFIG_USB_USBNET=y

          # =================================================
          # USB HID / GADGET
          # =================================================
          CONFIG_USB_G_ANDROID=y
          CONFIG_USB_F_HID=y
          CONFIG_CONFIGFS_F_HID=y

          # =================================================
          # WIRELESS CORE
          # =================================================
          CONFIG_WIRELESS=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y

          # =================================================
          # REALTEK R8188EUS
          # =================================================
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_NEW_REALTEK=y
          CONFIG_RTL8188EU=y

          # =================================================
          # BLUETOOTH OFF
          # =================================================
          CONFIG_BT=n
          CONFIG_MSM_BT_POWER=n
          CONFIG_BTFM_SLIM=n

          EOF

          echo
          echo "=================================================="
          echo " CONFIG SEBELUM DEFCONFIG"
          echo "=================================================="

          grep -nE \
            'CONFIG_USB=|CONFIG_USB_USBNET|CONFIG_USB_G_ANDROID|CONFIG_USB_F_HID|CONFIG_CONFIGFS_F_HID|CONFIG_WIRELESS|CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_WLAN_VENDOR_REALTEK|CONFIG_NEW_REALTEK|CONFIG_RTL8188EU|CONFIG_BT=' \
            "$CONFIG_FILE" \
            || true


      # =========================================================
      # CHECK REALTEK SOURCE
      # =========================================================
      - name: Verify Realtek source
        run: |

          echo "=================================================="
          echo " VERIFY REALTEK SOURCE"
          echo "=================================================="

          echo
          echo "--- REALTEK KCONFIG ---"

          grep -n -A15 -B5 \
            "config WLAN_VENDOR_REALTEK" \
            drivers/net/wireless/realtek/Kconfig \
            || true

          echo
          echo "--- NEW_REALTEK ---"

          grep -n -A15 -B5 \
            "config NEW_REALTEK" \
            drivers/net/wireless/realtek/newrtl/Kconfig \
            || true

          echo
          echo "--- RTL8188EU ---"

          cat \
            drivers/net/wireless/realtek/newrtl/rtl8188eus/Kconfig \
            || true


      # =========================================================
      # GENERATE DEFCONFIG
      # =========================================================
      - name: Generate tissot defconfig
        run: |

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=================================================="
          echo " MAKE TISSOT_DEFCONFIG"
          echo "=================================================="

          make tissot_defconfig


      # =========================================================
      # VERIFY FINAL .CONFIG
      # =========================================================
      - name: Verify final R8188EUS config
        run: |

          echo "=================================================="
          echo " HASIL KCONFIG DI .config"
          echo "=================================================="

          echo
          echo "--- USB / HID ---"

          grep -nE \
            'CONFIG_USB=|CONFIG_USB_USBNET|CONFIG_USB_G_ANDROID|CONFIG_USB_F_HID|CONFIG_CONFIGFS_F_HID' \
            .config \
            || true

          echo
          echo "--- WIRELESS CORE ---"

          grep -nE \
            'CONFIG_WLAN=|CONFIG_WIRELESS=|CONFIG_CFG80211=|CONFIG_MAC80211=' \
            .config \
            || true

          echo
          echo "--- REALTEK ---"

          grep -nE \
            'CONFIG_WLAN_VENDOR_REALTEK=|CONFIG_NEW_REALTEK=|CONFIG_RTL8188EU=' \
            .config \
            || true

          echo
          echo "--- NEGATIVE REALTEK ---"

          grep -nE \
            '# CONFIG_WLAN_VENDOR_REALTEK is not set|# CONFIG_NEW_REALTEK is not set|# CONFIG_RTL8188EU is not set' \
            .config \
            || true


      # =========================================================
      # HARD VALIDATION
      # =========================================================
      - name: Validate R8188EUS
        run: |

          echo "=================================================="
          echo " VALIDASI R8188EUS"
          echo "=================================================="

          FAILED=0

          if grep -q '^CONFIG_WLAN_VENDOR_REALTEK=y$' .config; then
              echo "OK: CONFIG_WLAN_VENDOR_REALTEK=y"
          else
              echo "ERROR: CONFIG_WLAN_VENDOR_REALTEK tidak aktif"
              FAILED=1
          fi

          if grep -q '^CONFIG_NEW_REALTEK=y$' .config; then
              echo "OK: CONFIG_NEW_REALTEK=y"
          else
              echo "ERROR: CONFIG_NEW_REALTEK tidak aktif"
              FAILED=1
          fi

          if grep -q '^CONFIG_RTL8188EU=y$' .config; then
              echo "OK: CONFIG_RTL8188EU=y"
          else
              echo "ERROR: CONFIG_RTL8188EU tidak aktif"
              FAILED=1
          fi

          echo

          if [ "$FAILED" -eq 0 ]; then
              echo "=================================================="
              echo " R8188EUS CONFIG: SEMUA OK"
              echo "=================================================="
          else
              echo "=================================================="
              echo " R8188EUS CONFIG: GAGAL"
              echo "=================================================="

              echo
              echo "Isi .config:"
              grep -nE \
                'WLAN_VENDOR_REALTEK|NEW_REALTEK|RTL8188EU' \
                .config \
                || true

              exit 1
          fi


      # =========================================================
      # BUILD
      # =========================================================
      - name: Compile kernel
        run: |

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export LOCALVERSION="-Umbaran_01"
          export KBUILD_BUILD_USER="sukma"
          export KBUILD_BUILD_HOST="UmbaranDev-Cloud"

          export ROOT_DIR="${{ github.workspace }}"

          export INTERNAL_INCLUDES="\
          -I${ROOT_DIR}/include \
          -I${ROOT_DIR}/arch/arm64/include \
          -I${ROOT_DIR}/arch/arm64/include/generated \
          -I${ROOT_DIR}/include/generated"

          echo "=================================================="
          echo " MULAI KOMPILASI KERNEL"
          echo "=================================================="

          make -j$(nproc --all) \
            KCFLAGS="-w -fpermissive ${INTERNAL_INCLUDES}" \
            CFLAGS_MODULE="-w" \
            CONFIG_SYSTEM_TRUSTED_KEYS="" \
            CONFIG_MODULE_SIG=n \
            CONFIG_MSM_AVTIMER=n \
            CONFIG_BT=n


      # =========================================================
      # CHECK BUILD OUTPUT
      # =========================================================
      - name: Check kernel output
        run: |

          echo "=================================================="
          echo " HASIL BUILD"
          echo "=================================================="

          find arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( \
              -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "*.dtb" \
            \) \
            -print


      # =========================================================
      # PREPARE ARTIFACT
      # =========================================================
      - name: Prepare artifact
        run: |

          mkdir -p output

          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
              cp arch/arm64/boot/Image.gz-dtb output/
          elif [ -f arch/arm64/boot/Image.gz ]; then
              cp arch/arm64/boot/Image.gz output/
          fi

          find arch/arm64/boot/dts \
            -type f \
            -name "*.dtb" \
            -exec cp {} output/ \; \
            2>/dev/null || true

          echo "=================================================="
          echo " FILE OUTPUT"
          echo "=================================================="

          ls -lh output


      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: tissot-kernel-r8188eus
          path: output/
